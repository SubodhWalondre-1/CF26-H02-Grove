[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Pure unit tests — no DB, no network
    integration: Tests that hit the DB and the full FastAPI app
    concurrency: Tests that fire multiple concurrent coroutines

log_cli = true
log_cli_level = WARNING
